<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signing you in…</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:15px/1.6 ui-sans-serif, system-ui, sans-serif; opacity:.7; }
</style>
</head>
<body>
  <p>Signing you in…</p>
  <script type="module">
    import { postCallbackToOpener } from '@ai-oauth-sdk/browser'

    // The provider redirected here with ?code=…&state=…. This page is
    // same-origin with the opener, so it can hand the callback back and close.
    if (!postCallbackToOpener()) {
      document.body.textContent =
        'This page was not opened by a sign-in popup. You can close it.'
    }
  </script>
</body>
</html>
