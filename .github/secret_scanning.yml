# Files that legitimately contain published, non-confidential client credentials.
#
# `publicClientSecrets.google` is the installed-app secret gemini-cli ships. OAuth
# treats installed-app secrets as non-confidential — Google documents them as such,
# and PKCE is what actually protects the flow — but the value still matches the
# `GOCSPX-` pattern, so without this every push raises an alert on a credential that
# is public by design.
#
# This suppresses *alerts in this repository*. It does not opt out of GitHub's
# partner program: for a public repo, a matched pattern can still be forwarded to
# the issuer, who may rotate it. That breaks nothing structurally — see
# docs/content/resources/credentials.mdx for the override paths — but if
# `login google` starts returning `invalid_client`, a rotation is the first
# thing to check.
paths-ignore:
  - 'packages/core/src/providers/public-client-ids.ts'
  - 'docs/content/resources/credentials.mdx'
  - 'packages/*/dist/**'
