name: Test

# Reusable, so CI and Release run byte-identical checks and a release can
# genuinely depend on them rather than racing them in a parallel workflow.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      # Every action is pinned to a commit, not a tag. A tag is a mutable
      # pointer its owner can move, which is how tj-actions/changed-files was
      # turned against every repo that trusted it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No `version` input on purpose: the root package.json `packageManager`
      # field is the single source of truth, and v4 fails outright when both
      # are set ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # No dependency lifecycle script ever runs. pnpm 10 already blocks them
      # by default; the flag keeps that true if the default is ever relaxed.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # Resolves every published subpath through Node's real resolver against
      # built dist — unit tests import source, so they cannot catch a broken
      # `exports` map.
      - run: pnpm verify:exports

      # Zero runtime dependencies, so this is really about the build chain —
      # but a compromised build tool is exactly how a token-handling package
      # would get backdoored.
      #
      # One advisory is ignored in package.json (pnpm.auditConfig): the
      # brace-expansion OOM, GHSA-mh99-v99m-4gvg. It reaches us only through
      # ESLint's own minimatch@3, the 1.x line has no patched release, and
      # overriding it to 5.x crashes ESLint's config loader. Nothing in it
      # ships. Drop the ignore the moment ESLint stops depending on it.
      - run: pnpm audit --audit-level high
        if: matrix.node == 24
